- id: ROAD-014
  title: "roadrunner resume \u2014 --session-id"
  status: done
  depends_on:
  - ROAD-011
  goal: "Claude Code supports session resumption via 'claude --resume <id>'. Roadrunner's\n\
    resume today is 'Python re-reads disk state and injects a brief into the NEXT\n\
    session.' Convenience win: if the operator crashed mid-task, let them pop back\n\
    into the SAME Claude session that was running.\n\nCapture the Claude Code session\
    \ ID from session metadata on every SessionStart hook\nfire; store it in .roadmap_state.json\
    \ as last_session_id. The schema bump rides\nalong with ROAD-011's v2 -> v3 migration\
    \ \u2014 do not bump the version a second time.\nAdd 'roadrunner resume --session-id'\
    \ (no args = read from state) that prints the\n'claude --resume <id>' command\
    \ for the operator to paste, and 'roadrunner resume\n--exec' that runs it directly.\
    \ Graceful no-op + helpful message if no session ID\nis recorded yet. Display\
    \ the last session ID in 'roadrunner status'.\n\nPure operator-ergonomics improvement;\
    \ does not change loop semantics.\n"
  acceptance_criteria:
  - SessionStart hook records the current Claude Code session ID into .roadmap_state.json
    as last_session_id
  - Schema bump piggybacks on ROAD-011's v2 -> v3 migration (no second bump)
  - roadrunner resume --session-id (no args) prints the claude --resume command
  - roadrunner resume --exec runs claude --resume <id> directly
  - Graceful no-op + helpful message if no session ID has been recorded yet
  - roadrunner status displays the last session ID
  - Unit test test_session_id_capture covers the SessionStart write
  - All existing tests continue to pass
  - ruff check and mypy pass
  validation_commands:
  - python3 -m roadrunner resume --help
  - grep -q "last_session_id" src/roadrunner/state.py
  - grep -qE "session-id|session_id" src/roadrunner/cli.py
  - python3 -m pytest tests/ -q -k "session_id"
  - python3 -m pytest tests/ -q
  - ruff check src/roadrunner tests/ hooks/
  - python3 -m mypy src/roadrunner --ignore-missing-imports
  documentation_targets:
  - CHANGELOG.md
  - docs/configuration.md
  - logs/ROAD-014.md
  files_expected:
  - src/roadrunner/cli.py
  - src/roadrunner/state.py
  - src/roadrunner/session.py
  - hooks/sessionstart_hook.sh
  - tests/test_roadrunner.py
  notes: 'Source: docs/v1.1-enhancement-issues.md issue #8. Depends on ROAD-011 so
    the v2 -> v3 schema bump happens exactly once and last_session_id rides along
    with session_cost_usd. If the Claude Code session metadata does not expose the
    session ID reliably, gate the SessionStart capture behind a defensive try/except
    and emit a one-time warning.

    '
- id: ROAD-015
  title: Project-wide baseline validation suite
  status: done
  depends_on: []
  goal: 'Per-task validation_commands let each task drift from CI''s gate. The

    2026-05-28 incident (mypy src/roadrunner vs CI''s mypy src tests) shipped two
    red

    CI runs in a row because no runtime enforcement keeps the loop''s gate aligned

    with CI''s. CLAUDE.md conventions are suggestion-only; only the code path is

    deterministic.


    Add an optional top-level baseline_validation list[str] field to tasks.yaml.

    cmd_validate prepends those commands before each task''s validation_commands,

    with first-failure short-circuit and a clear distinction in the failure report

    between baseline failures and task-specific failures. When baseline_validation

    is absent or empty, behavior is unchanged (backward compat for v1.0 projects).


    This project sets baseline_validation to the three CI commands so the loop''s

    validate gate is structurally equal to CI. The feature is language-agnostic by

    design: a TypeScript project sets npm test, eslint, npx tsc --noEmit; the

    runtime treats them as opaque shell commands.

    '
  acceptance_criteria:
  - tasks.yaml can declare a top-level baseline_validation list-of-strings field
  - cmd_validate runs every baseline command before the task's validation_commands
  - First baseline failure short-circuits the rest of validation (same exit semantics
    as per-task)
  - Validation output distinguishes baseline failures from task-specific failures
  - When baseline_validation is absent or empty, behavior is unchanged (backward compat)
  - This project's tasks.yaml has baseline_validation set to the three CI commands
    (pytest, ruff, mypy)
  - docs/configuration.md documents the new field with a language-agnostic note and
    a TypeScript example
  - tests/test_roadrunner.py adds a TestBaselineValidation class covering on/off/short-circuit/error-shape
  - All existing tests continue to pass
  - ruff check src/ hooks/ tests/ passes
  - python3 -m mypy src tests --ignore-missing-imports passes
  validation_commands:
  - grep -q "baseline_validation" src/roadrunner/cli.py
  - grep -q "baseline_validation" docs/configuration.md
  - grep -q "^baseline_validation:" tasks/tasks.yaml
  - python3 -m pytest tests/ -q -k "baseline_validation"
  - python3 -m pytest tests/ -q
  - ruff check src/ hooks/ tests/
  - python3 -m mypy src tests --ignore-missing-imports
  documentation_targets:
  - CHANGELOG.md
  - docs/configuration.md
  - logs/ROAD-015.md
  files_expected:
  - src/roadrunner/cli.py
  - tasks/tasks.yaml
  - docs/configuration.md
  - tests/test_roadrunner.py
  notes: "Dogfoods itself. Once implemented, ROAD-015's own validate run will fire\
    \ the\nnew baseline_validation suite in addition to the task-specific commands.\n\
    The validation_commands list above includes the three CI commands explicitly\n\
    so the task is self-validating even before the baseline mechanism is wired up;\n\
    once wired, the same three run twice (once as baseline, once as task-specific).\n\
    That double-run is intentional \u2014 it proves the feature is live before complete\n\
    fires. Validation scope deliberately mirrors CI's exact invocation so local-green\n\
    is the same gate as CI-green going forward.\n"

- id: ROAD-010
  title: Per-session iteration counter with reset on SessionStart
  status: done
  depends_on: []
  goal: "Split the iteration counter into two values so the runaway-protection cap\
    \ becomes\nper-session instead of lifetime-cumulative. Bug observed 2026-04-24:\
    \ iteration hit\n92 against max_iter=50 because every Stop-hook fire incremented\
    \ and persisted the\ncounter across all 'claude' invocations, making the cap a\
    \ lifetime ceiling rather\nthan a per-run runaway guard.\n\nChanges:\n  - Keep\
    \ 'iteration' in .roadmap_state.json as the lifetime audit counter (preserves\n\
    \    existing traces and backward compat).\n  - Add 'session_iteration' (int,\
    \ default 0) to RoadmapState TypedDict. Reset to 0 in\n    cmd_session_start.\n\
    \  - Gate the max-iterations check in cmd_check_stop on session_iteration, not\n\
    \    iteration. Raise DEFAULT session cap from 50 \u2192 100.\n  - Add 'reset-iteration\
    \ [--soft|--hard]' subcommand. --soft resets session_iteration;\n    --hard zeros\
    \ both.\n  - Surface both counters in cmd_status output and in _build_task_brief.\n\
    \  - Bump STATE_SCHEMA_VERSION and add a migration that defaults session_iteration=0\n\
    \    for state files written by older versions.\n"
  acceptance_criteria:
  - RoadmapState TypedDict has both iteration and session_iteration fields
  - cmd_session_start resets session_iteration to 0 while preserving iteration
  - cmd_check_stop compares session_iteration (not iteration) against max_iter
  - Default max_iter passed by check_stop hook is 100 (was 50)
  - reset-iteration --soft resets session_iteration only
  - reset-iteration --hard resets both counters
  - cmd_status output shows both counters with clear labels
  - State files without session_iteration load cleanly (treated as 0)
  - STATE_SCHEMA_VERSION bumped
  - All existing tests continue to pass
  - ruff check and mypy pass
  validation_commands:
  - python3 roadrunner.py reset-iteration --help
  - python3 -m pytest tests/ -q
  - ruff check roadrunner.py tests/ hooks/
  - python3 -m mypy roadrunner.py --ignore-missing-imports
  - grep -q "session_iteration" roadrunner.py
  documentation_targets:
  - CHANGELOG.md
  - logs/ROAD-010.md
  - docs/configuration.md
  files_expected:
  - roadrunner.py
  - hooks/stop_hook.sh
  notes: 'Traced to docs/resolution-plan-2026-04-24.md Issue 1. Cap value 100 approved
    by Alex 2026-04-24. STATE_SCHEMA_VERSION bump must include backward-compat for
    older state files missing session_iteration. Write tests that simulate a SessionStart
    boundary and assert reset behavior. entra-triage vendors this file and syncs periodically;
    no coordination needed as it reads state via setdefault-based migration.

    '
- id: ROAD-011
  title: "Token / cost budget halt \u2014 ROADMAP_MAX_BUDGET_USD"
  status: done
  depends_on: []
  goal: 'Roadrunner caps session iterations but not session cost; two tasks that each
    take

    50 iterations can differ 10x in dollars depending on tool-use density and model

    choice. Operators running overnight loops have no upper bound on cost.


    Add a ROADMAP_MAX_BUDGET_USD env var (and matching --max-budget-usd flag on

    ''roadrunner check-stop''). Track per-session cost in .roadmap_state.json (new

    field session_cost_usd, schema bump v2 -> v3). cmd_check_stop evaluates the

    budget alongside the iteration cap and emits the same hard-halt JSON shape on

    overrun. Surface current spend + budget in ''roadrunner status'' and ''roadrunner

    health''. Record a ''budget_exceeded'' trace event on halt.


    Cost data comes from Claude Code''s per-turn session metadata; if the data isn''t

    surfaced reliably, gate the feature behind a config flag that defaults off and

    emits a one-time warning rather than breaking the loop.

    '
  acceptance_criteria:
  - ROADMAP_MAX_BUDGET_USD env var honored by check-stop
  - --max-budget-usd flag on check-stop overrides the env var
  - .roadmap_state.json schema bumped to v3 with session_cost_usd field
  - Schema migration v2 -> v3 fills session_cost_usd with 0.0 for existing state files
  - "Budget overrun returns {\"continue\": false, \"stopReason\": \"...\"} \u2014\
    \ same hard-halt shape as the iteration cap"
  - roadrunner status and roadrunner health surface current spend + budget
  - Trace event budget_exceeded recorded on halt
  - If per-turn cost data is unavailable, feature gracefully no-ops with a one-time
    warning
  - tests/test_roadrunner.py::TestCheckStop covers the budget-halt path
  - docs/configuration.md documents the new env var and state field
  - All existing tests continue to pass
  - ruff check and mypy pass
  validation_commands:
  - python3 -m roadrunner check-stop --help
  - grep -qE "ROADMAP_MAX_BUDGET_USD|max_budget_usd" src/roadrunner/cli.py src/roadrunner/state.py
  - grep -q "session_cost_usd" src/roadrunner/state.py
  - grep -q "STATE_SCHEMA_VERSION = 3" src/roadrunner/state.py
  - grep -q "ROADMAP_MAX_BUDGET_USD" docs/configuration.md
  - python3 -m pytest tests/ -q
  - ruff check src/roadrunner tests/ hooks/
  - python3 -m mypy src/roadrunner --ignore-missing-imports
  documentation_targets:
  - CHANGELOG.md
  - docs/configuration.md
  - logs/ROAD-011.md
  files_expected:
  - src/roadrunner/cli.py
  - src/roadrunner/state.py
  - docs/configuration.md
  - tests/test_roadrunner.py
  notes: 'Bundles the .roadmap_state.json v2 -> v3 schema bump because ROAD-014 also
    needs it; that task depends on ROAD-011 so the migration lands once. Source: docs/v1.1-enhancement-issues.md
    issue #2.

    '
- id: ROAD-012
  title: Per-task model selection
  status: done
  depends_on: []
  goal: 'Some tasks (''rename a variable across 12 files'') deserve Haiku; others
    (''design

    and implement the schema migration'') deserve Opus. Today Roadrunner relies on
    the

    operator setting ''claude --model'' globally; there is no way to vary by task.


    Add an optional ''model:'' field (free-form string) to the tasks.yaml schema.

    Validate against known model IDs at load time with a WARNING rather than an error

    so the schema stays forward-compatible. Surface the chosen model in ''roadrunner

    status'' and in the resume / next-task brief written by the Stop hook so the agent

    knows it was downshifted or upshifted. Include the field in every check_stop

    trace.jsonl event for the active task so future analysis can correlate model

    choice to outcome. Extend ''roadrunner analyze'' to report task count by model.


    This is documentation + telemetry; it does not change the runtime. Operators

    who want to enforce the choice wrap ''claude'' in a script that reads the field.

    '
  acceptance_criteria:
  - Optional model field added to the tasks.yaml schema in docs/configuration.md
  - Field surfaced in roadrunner status and the resume / next-task brief
  - trace.jsonl check_stop events include the model field on the active task
  - roadrunner analyze reports task count grouped by model
  - Schema validator warns (not errors) on unknown model IDs
  - Unit test test_tasks_yaml_model_field covers parsing and brief rendering
  - All existing tests continue to pass
  - ruff check and mypy pass
  validation_commands:
  - grep -q "^### .*model\|^| .model" docs/configuration.md || grep -q "model" docs/configuration.md
  - python3 -m roadrunner analyze
  - python3 -m pytest tests/ -q -k "model_field or tasks_yaml"
  - python3 -m pytest tests/ -q
  - ruff check src/roadrunner tests/
  - python3 -m mypy src/roadrunner --ignore-missing-imports
  documentation_targets:
  - CHANGELOG.md
  - docs/configuration.md
  - logs/ROAD-012.md
  files_expected:
  - src/roadrunner/cli.py
  - docs/configuration.md
  - tests/test_roadrunner.py
  notes: "Source: docs/v1.1-enhancement-issues.md issue #5. Keep the validator a warning,\
    \ not an error, so an unrecognized model ID in tasks.yaml never blocks the loop\
    \ \u2014 forward compatibility matters more than strict validation here.\n"
- id: ROAD-013
